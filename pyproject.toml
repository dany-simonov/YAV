[project]
name = "istochnik"
version = "0.5.0"
requires-python = ">=3.11"

dependencies = [
    "aiogram==3.7.0",
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "httpx==0.27.0",
    "pydantic==2.7.0",
    "pydantic-settings==2.3.0",
    "ffmpeg-python==0.2.0",
    "python-multipart==0.0.9",
    "aiofiles==23.2.1",
    "Pillow>=10,<13",
    "reportlab==4.2.0",
    "g4f @ git+https://github.com/xtekky/gpt4free.git",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require real API keys and network access",
]
